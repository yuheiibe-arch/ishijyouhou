<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: #f8f9fa; color: #333; }
    #sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; background: #e8f0fe; border-bottom: 1px solid #ddd; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    #doctor-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
    .doctor-item { padding: 12px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; transition: background 0.2s; }
    .doctor-item:hover { background: #f1f3f4; }
    .doctor-item.active { background: #e8f0fe; border-left: 4px solid #1a73e8; }
    /* 退職予定の医師用のスタイル（選択不可） */
    .doctor-item.disabled { color: #9aa0a6; cursor: not-allowed; background: #f8f9fa; }
    .doctor-item.disabled:hover { background: #f8f9fa; }
    
    .doctor-item input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); cursor: pointer; }
    .doctor-item.disabled input[type="checkbox"] { cursor: not-allowed; }
    .doctor-name { flex: 1; font-size: 14px; pointer-events: none; }
    
    /* 退職日の赤文字指定 */
    .retire-date { font-size: 12px; color: #d93025; font-weight: bold; margin-left: 8px; }
    
    #main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; overflow: hidden; }
    .pane { flex: 1; display: flex; flex-direction: column; margin-bottom: 15px; }
    .pane-title { font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #5f6368; }
    textarea { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: monospace; resize: none; background: #fff; line-height: 1.5; white-space: pre-wrap; }
    textarea.readonly { background: #f1f3f4; color: #555; }
    
    .controls { display: flex; justify-content: flex-end; padding-top: 10px; border-top: 1px solid #ddd; }
    button { padding: 10px 24px; font-size: 15px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    .btn-update { background: #1a73e8; color: #fff; }
    .btn-update:hover { background: #1557b0; }
    .btn-update:disabled { background: #9aa0a6; cursor: not-allowed; }
    .btn-cancel { background: #f1f3f4; color: #333; margin-right: 10px; }
    .btn-cancel:hover { background: #e8eaed; }

    #loading { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:flex; justify-content:center; align-items:center; flex-direction:column; z-index: 1000; font-weight:bold; font-size: 16px;}
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">マスタから契約データを読み込んでいます...</div>
  </div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span id="sheet-name-label">医師リスト</span>
      <label style="font-size: 12px; font-weight: normal; cursor: pointer;">
        <input type="checkbox" id="check-all" checked onchange="toggleAll(this)"> 全選択
      </label>
    </div>
    <ul id="doctor-list"></ul>
  </div>

  <div id="main-content">
    <div class="pane">
      <div class="pane-title">■ 現在の記載 (読み取り専用)</div>
      <textarea id="current-text" class="readonly" readonly></textarea>
    </div>
    
    <div class="pane">
      <div class="pane-title">■ 新しい記載 (プレビュー 兼 編集エディタ)</div>
      <textarea id="proposed-text" oninput="onProposedTextChange()"></textarea>
    </div>
    
    <div class="controls">
      <button class="btn-cancel" onclick="google.script.host.close()">キャンセル</button>
      <button class="btn-update" id="btn-submit" onclick="submitUpdates()">一括更新を実行</button>
    </div>
  </div>

  <script>
    let doctorsData = [];
    let targetSheetName = "";
    let activeIndex = 0;

    window.onload = function() {
      google.script.run
        .withSuccessHandler(initUI)
        .withFailureHandler(showError)
        .cu_getContractData();
    };

    function initUI(response) {
      targetSheetName = response.sheetName;
      doctorsData = response.doctors;
      
      document.getElementById('sheet-name-label').textContent = targetSheetName;
      document.getElementById('loading').style.display = 'none';
      
      if(doctorsData.length === 0) {
        document.getElementById('main-content').innerHTML = "<h3 style='text-align:center; margin-top:50px;'>更新可能なデータが見つかりませんでした。</h3>";
        return;
      }
      
      renderList();
      selectDoctor(0);
      updateCheckAllStatus(); 
    }

    function showError(err) {
      document.getElementById('loading-text').textContent = "エラーが発生しました: " + err.message;
      document.querySelector('.spinner').style.display = 'none';
    }

    function renderList() {
      const listObj = document.getElementById('doctor-list');
      listObj.innerHTML = '';

      doctorsData.forEach((doc, index) => {
        const li = document.createElement('li');
        // ブロック対象の医師には disabled クラスを付与
        li.className = 'doctor-item' + (index === activeIndex ? ' active' : '') + (doc.disabled ? ' disabled' : '');
        
        li.onclick = (e) => {
          if(e.target.type !== 'checkbox') selectDoctor(index);
        };

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = doc.checked;
        if (doc.disabled) cb.disabled = true; // チェックボックスを無効化
        
        cb.onclick = (e) => {
          if (doc.disabled) { e.preventDefault(); return; }
          doc.checked = e.target.checked;
          updateCheckAllStatus();
        };

        const span = document.createElement('span');
        span.className = 'doctor-name';
        span.textContent = doc.name;
        
        // 退職日の赤文字を追加
        if (doc.disabled) {
          const label = document.createElement('span');
          label.className = 'retire-date';
          label.textContent = `(退職日: ${doc.retireDateStr})`;
          span.appendChild(label);
        }

        li.appendChild(cb);
        li.appendChild(span);
        listObj.appendChild(li);
      });
    }

    function selectDoctor(index) {
      if(doctorsData.length === 0) return;
      activeIndex = index;
      
      const items = document.querySelectorAll('.doctor-item');
      items.forEach((item, i) => {
        if(i === index) item.classList.add('active');
        else item.classList.remove('active');
      });

      const doc = doctorsData[index];
      document.getElementById('current-text').value = doc.current;
      document.getElementById('proposed-text').value = doc.proposed;
      
      // 退職予定者の場合はエディタも読み取り専用にする
      if (doc.disabled) {
        document.getElementById('proposed-text').classList.add('readonly');
        document.getElementById('proposed-text').readOnly = true;
      } else {
        document.getElementById('proposed-text').classList.remove('readonly');
        document.getElementById('proposed-text').readOnly = false;
      }
    }

    function onProposedTextChange() {
      if (!doctorsData[activeIndex].disabled) {
        doctorsData[activeIndex].proposed = document.getElementById('proposed-text').value;
      }
    }

    function toggleAll(chk) {
      // ブロックされていない医師だけを対象にチェックを切り替える
      doctorsData.forEach(doc => {
        if (!doc.disabled) doc.checked = chk.checked;
      });
      renderList();
    }

    function updateCheckAllStatus() {
      const activeDocs = doctorsData.filter(d => !d.disabled);
      if (activeDocs.length === 0) return;
      const allChecked = activeDocs.every(doc => doc.checked);
      document.getElementById('check-all').checked = allChecked;
    }

    function submitUpdates() {
      const targetCount = doctorsData.filter(d => d.checked && !d.disabled).length;
      if (targetCount === 0) {
        alert("更新する医師が選択されていません。");
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "保存中...";

      const payload = {
        sheetName: targetSheetName,
        updates: doctorsData
      };

      google.script.run
        .withSuccessHandler(function() {
          google.script.host.close();
        })
        .withFailureHandler(function(err) {
          showError(err);
          btn.disabled = false;
          btn.innerText = "一括更新を実行";
        })
        .cu_saveContracts(payload);
    }
  </script>
</body>
</html>
